<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBus AI - Real-Time Bus Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
<div class="w-full h-screen bg-gray-50 flex flex-col overflow-hidden">
  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-900 to-blue-700 text-white px-6 py-4 flex items-center justify-between shadow-lg z-20">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4 4"/></svg>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">CampusBus AI</h1>
        <p class="text-xs text-blue-200">Real-Time Tracking & Smart Notifications</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg">
        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
        <span class="text-sm font-medium" id="active-buses">4 Active</span>
      </div>
      <button onclick="toggleNotifications()" id="notif-btn" class="relative p-2 bg-white/10 rounded-lg hover:bg-white/20 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span id="notif-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-xs rounded-full flex items-center justify-center hidden">3</span>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-gray-200 flex flex-col z-10 shadow-sm">
      <!-- Route Selector -->
      <div class="p-4 border-b border-gray-100">
        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Select Route</label>
        <select id="route-select" onchange="changeRoute()" class="mt-2 w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <option value="all">All Routes</option>
          <option value="route1" selected>Route A: North Campus Loop</option>
          <option value="route2">Route B: South Campus Express</option>
          <option value="route3">Route C: Downtown Connector</option>
          <option value="route4">Route D: Housing Shuttle</option>
        </select>
      </div>

      <!-- Bus List -->
      <div class="flex-1 overflow-y-auto p-4 space-y-3" id="bus-list"></div>

      <!-- Notification Panel -->
      <div class="border-t border-gray-200 p-4 bg-gray-50">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-gray-700 flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Recent Alerts
          </h3>
          <button onclick="clearNotifications()" class="text-xs text-blue-600 hover:text-blue-800">Clear</button>
        </div>
        <div id="notification-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
      </div>
    </aside>

    <!-- Map Area -->
    <main class="flex-1 relative bg-gray-100 overflow-hidden">
      <canvas id="mapCanvas" class="w-full h-full"></canvas>

      <!-- Map Controls -->
      <div class="absolute top-4 right-4 flex flex-col gap-2">
        <button onclick="zoomIn()" class="w-10 h-10 bg-white rounded-lg shadow-md flex items-center justify-center hover:bg-gray-50 transition text-gray-700 font-bold text-lg">+</button>
        <button onclick="zoomOut()" class="w-10 h-10 bg-white rounded-lg shadow-md flex items-center justify-center hover:bg-gray-50 transition text-gray-700 font-bold text-lg">−</button>
        <button onclick="resetView()" class="w-10 h-10 bg-white rounded-lg shadow-md flex items-center justify-center hover:bg-gray-50 transition" title="Reset View">
          <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>

      <!-- Legend -->
      <div class="absolute bottom-4 left-4 bg-white/95 backdrop-blur rounded-xl shadow-lg p-4 border border-gray-200">
        <h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Map Legend</h4>
        <div class="space-y-2 text-sm">
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-500"></span><span class="text-gray-600">On Time</span></div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-yellow-500"></span><span class="text-gray-600">Delayed (5-15min)</span></div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500"></span><span class="text-gray-600">Severely Delayed</span></div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-500"></span><span class="text-gray-600">Bus Stop</span></div>
        </div>
      </div>

      <!-- ETA Popup -->
      <div id="eta-popup" class="absolute hidden bg-white rounded-xl shadow-2xl p-4 border border-gray-200 min-w-[280px] z-30 transition-all duration-300">
        <div class="flex items-start justify-between mb-2">
          <div>
            <h3 class="font-bold text-gray-800" id="popup-bus-name">Bus 101</h3>
            <p class="text-sm text-gray-500" id="popup-route">Route A</p>
          </div>
          <span id="popup-status" class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700">On Time</span>
        </div>
        <div class="space-y-2 mt-3">
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Next Stop:</span>
            <span class="font-medium text-gray-800" id="popup-next">Student Center</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">ETA:</span>
            <span class="font-bold text-blue-600" id="popup-eta">3 min</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Speed:</span>
            <span class="font-medium text-gray-800" id="popup-speed">24 mph</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">Occupancy:</span>
            <div class="flex items-center gap-1">
              <div class="w-16 h-2 bg-gray-200 rounded-full overflow-hidden">
                <div id="popup-occupancy" class="h-full bg-blue-500 rounded-full" style="width: 65%"></div>
              </div>
              <span class="text-xs text-gray-500" id="popup-occupancy-text">65%</span>
            </div>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-gray-100 flex gap-2">
          <button onclick="trackBus()" class="flex-1 bg-blue-600 text-white text-sm py-2 rounded-lg hover:bg-blue-700 transition">Track Live</button>
          <button onclick="notifyMe()" class="flex-1 bg-gray-100 text-gray-700 text-sm py-2 rounded-lg hover:bg-gray-200 transition">Notify Me</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
// ==================== DATA & CONFIG ====================
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

let zoom = 1;
let offsetX = 0, offsetY = 0;
let isDragging = false;
let lastMouseX, lastMouseY;
let selectedBus = null;
let currentRoute = 'all';
let notifications = [];
let notifEnabled = true;

// Campus map coordinates (simplified grid)
const stops = {
  'Student Center': { x: 200, y: 300 },
  'Library': { x: 350, y: 200 },
  'Engineering Hall': { x: 500, y: 250 },
  'Science Complex': { x: 600, y: 400 },
  'Dorms North': { x: 150, y: 150 },
  'Dorms South': { x: 450, y: 500 },
  'Stadium': { x: 700, y: 300 },
  'Medical Center': { x: 300, y: 450 },
  'Parking A': { x: 100, y: 350 },
  'Admin Building': { x: 400, y: 100 }
};

const routes = {
  route1: {
    name: 'Route A: North Campus Loop',
    color: '#3B82F6',
    stops: ['Dorms North', 'Library', 'Engineering Hall', 'Stadium', 'Dorms North'],
    path: []
  },
  route2: {
    name: 'Route B: South Campus Express',
    color: '#10B981',
    stops: ['Student Center', 'Medical Center', 'Dorms South', 'Science Complex', 'Student Center'],
    path: []
  },
  route3: {
    name: 'Route C: Downtown Connector',
    color: '#F59E0B',
    stops: ['Admin Building', 'Library', 'Student Center', 'Parking A', 'Admin Building'],
    path: []
  },
  route4: {
    name: 'Route D: Housing Shuttle',
    color: '#8B5CF6',
    stops: ['Dorms North', 'Dorms South', 'Medical Center', 'Student Center', 'Dorms North'],
    path: []
  }
};

// Generate smooth paths from stops
Object.keys(routes).forEach(key => {
  const route = routes[key];
  route.stops.forEach((stopName, i) => {
    if (i < route.stops.length - 1) {
      const start = stops[stopName];
      const end = stops[route.stops[i + 1]];
      const steps = 20;
      for (let j = 0; j <= steps; j++) {
        const t = j / steps;
        route.path.push({
          x: start.x + (end.x - start.x) * t + (Math.random() - 0.5) * 30 * Math.sin(t * Math.PI),
          y: start.y + (end.y - start.y) * t + (Math.random() - 0.5) * 20 * Math.sin(t * Math.PI)
        });
      }
    }
  });
});

const buses = [
  { id: 'BUS-101', route: 'route1', name: 'Bus 101', progress: 0.2, speed: 0.003, status: 'on-time', occupancy: 65, delay: 0, nextStop: 'Library' },
  { id: 'BUS-102', route: 'route1', name: 'Bus 102', progress: 0.7, speed: 0.0025, status: 'delayed', occupancy: 82, delay: 8, nextStop: 'Stadium' },
  { id: 'BUS-201', route: 'route2', name: 'Bus 201', progress: 0.45, speed: 0.0035, status: 'on-time', occupancy: 45, delay: 0, nextStop: 'Dorms South' },
  { id: 'BUS-301', route: 'route3', name: 'Bus 301', progress: 0.15, speed: 0.002, status: 'severe-delay', occupancy: 90, delay: 22, nextStop: 'Library' },
  { id: 'BUS-401', route: 'route4', name: 'Bus 401', progress: 0.6, speed: 0.003, status: 'on-time', occupancy: 30, delay: 0, nextStop: 'Medical Center' }
];

// ==================== INITIALIZATION ====================
function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  offsetX = canvas.width / 2 - 400;
  offsetY = canvas.height / 2 - 300;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==================== MAP RENDERING ====================
function drawMap() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(zoom, zoom);

  // Draw roads
  ctx.strokeStyle = '#E5E7EB';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';

  Object.keys(routes).forEach(key => {
    if (currentRoute !== 'all' && currentRoute !== key) return;
    const route = routes[key];
    ctx.strokeStyle = route.color + '30';
    ctx.beginPath();
    route.path.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    });
    ctx.stroke();
  });

  // Draw stops
  Object.entries(stops).forEach(([name, pos]) => {
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#3B82F6';
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#374151';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, pos.x, pos.y - 15);
  });

  // Draw buses
  buses.forEach(bus => {
    if (currentRoute !== 'all' && currentRoute !== bus.route) return;

    const route = routes[bus.route];
    const pathIndex = Math.floor(bus.progress * (route.path.length - 1));
    const pos = route.path[Math.min(pathIndex, route.path.length - 1)];

    // Bus glow
    const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 25);
    const color = bus.status === 'on-time' ? '#10B981' : bus.status === 'delayed' ? '#F59E0B' : '#EF4444';
    gradient.addColorStop(0, color + '60');
    gradient.addColorStop(1, color + '00');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
    ctx.fill();

    // Bus body
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 12, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Bus icon
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🚌', pos.x, pos.y);

    // Bus label
    ctx.fillStyle = '#1F2937';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(bus.name, pos.x, pos.y + 28);

    bus.screenX = pos.x;
    bus.screenY = pos.y;
  });

  ctx.restore();
}

// ==================== BUS LIST ====================
function updateBusList() {
  const list = document.getElementById('bus-list');
  list.innerHTML = '';

  buses.forEach(bus => {
    if (currentRoute !== 'all' && currentRoute !== bus.route) return;

    const statusColors = {
      'on-time': 'bg-green-100 text-green-700 border-green-200',
      'delayed': 'bg-yellow-100 text-yellow-700 border-yellow-200',
      'severe-delay': 'bg-red-100 text-red-700 border-red-200'
    };

    const statusText = {
      'on-time': 'On Time',
      'delayed': `Delayed ${bus.delay}m`,
      'severe-delay': `Delayed ${bus.delay}m`
    };

    const card = document.createElement('div');
    card.className = 'bg-white border border-gray-200 rounded-xl p-3 hover:shadow-md transition cursor-pointer';
    card.onclick = () => selectBus(bus);
    card.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm" style="background-color: ${routes[bus.route].color}20; color: ${routes[bus.route].color}">
            🚌
          </div>
          <div>
            <div class="font-semibold text-sm text-gray-800">${bus.name}</div>
            <div class="text-xs text-gray-500">${routes[bus.route].name.split(':')[0]}</div>
          </div>
        </div>
        <span class="px-2 py-0.5 rounded-full text-xs font-medium border ${statusColors[bus.status]}">${statusText[bus.status]}</span>
      </div>
      <div class="flex items-center justify-between text-xs text-gray-500">
        <span>Next: <span class="font-medium text-gray-700">${bus.nextStop}</span></span>
        <span class="font-bold text-blue-600">${Math.max(1, Math.floor((1 - bus.progress) * 15))} min</span>
      </div>
      <div class="mt-2 w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full transition-all duration-1000" style="width: ${bus.occupancy}%; background-color: ${routes[bus.route].color}"></div>
      </div>
      <div class="mt-1 text-xs text-gray-400 text-right">${bus.occupancy}% full</div>
    `;
    list.appendChild(card);
  });
}

// ==================== NOTIFICATIONS ====================
function addNotification(title, message, type = 'info') {
  const notif = { id: Date.now(), title, message, type, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
  notifications.unshift(notif);
  if (notifications.length > 10) notifications.pop();
  updateNotificationList();

  const badge = document.getElementById('notif-badge');
  badge.classList.remove('hidden');
  badge.textContent = notifications.length;
}

function updateNotificationList() {
  const list = document.getElementById('notification-list');
  list.innerHTML = '';

  const typeColors = {
    'info': 'bg-blue-50 border-blue-200 text-blue-700',
    'warning': 'bg-yellow-50 border-yellow-200 text-yellow-700',
    'alert': 'bg-red-50 border-red-200 text-red-700',
    'success': 'bg-green-50 border-green-200 text-green-700'
  };

  notifications.forEach(n => {
    const div = document.createElement('div');
    div.className = `p-2 rounded-lg border text-xs ${typeColors[n.type]}`;
    div.innerHTML = `
      <div class="font-semibold">${n.title}</div>
      <div class="mt-0.5 opacity-80">${n.message}</div>
      <div class="mt-1 text-[10px] opacity-60">${n.time}</div>
    `;
    list.appendChild(div);
  });
}

function clearNotifications() {
  notifications = [];
  updateNotificationList();
  document.getElementById('notif-badge').classList.add('hidden');
}

function toggleNotifications() {
  notifEnabled = !notifEnabled;
  const btn = document.getElementById('notif-btn');
  btn.style.opacity = notifEnabled ? '1' : '0.5';
  addNotification('Settings Updated', `Notifications ${notifEnabled ? 'enabled' : 'disabled'}`, 'info');
}

// ==================== INTERACTION ====================
function selectBus(bus) {
  selectedBus = bus;
  const popup = document.getElementById('eta-popup');
  popup.classList.remove('hidden');

  const route = routes[bus.route];
  const pathIndex = Math.floor(bus.progress * (route.path.length - 1));
  const pos = route.path[Math.min(pathIndex, route.path.length - 1)];

  popup.style.left = (offsetX + pos.x * zoom + 20) + 'px';
  popup.style.top = (offsetY + pos.y * zoom - 50) + 'px';

  document.getElementById('popup-bus-name').textContent = bus.name;
  document.getElementById('popup-route').textContent = routes[bus.route].name;
  document.getElementById('popup-next').textContent = bus.nextStop;
  document.getElementById('popup-eta').textContent = Math.max(1, Math.floor((1 - bus.progress) * 15)) + ' min';
  document.getElementById('popup-speed').textContent = (20 + Math.random() * 15).toFixed(0) + ' mph';
  document.getElementById('popup-occupancy').style.width = bus.occupancy + '%';
  document.getElementById('popup-occupancy-text').textContent = bus.occupancy + '%';

  const statusEl = document.getElementById('popup-status');
  if (bus.status === 'on-time') {
    statusEl.className = 'px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700';
    statusEl.textContent = 'On Time';
  } else if (bus.status === 'delayed') {
    statusEl.className = 'px-2 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-700';
    statusEl.textContent = `Delayed ${bus.delay}m`;
  } else {
    statusEl.className = 'px-2 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700';
    statusEl.textContent = `Delayed ${bus.delay}m`;
  }
}

function trackBus() {
  addNotification('Tracking Enabled', `You are now tracking ${selectedBus.name}. You'll receive arrival alerts.`, 'success');
}

function notifyMe() {
  addNotification('Alert Set', `You'll be notified when ${selectedBus.name} is 5 minutes away.`, 'info');
}

function changeRoute() {
  currentRoute = document.getElementById('route-select').value;
  updateBusList();
  drawMap();
}

function zoomIn() { zoom = Math.min(zoom * 1.2, 3); drawMap(); }
function zoomOut() { zoom = Math.max(zoom / 1.2, 0.5); drawMap(); }
function resetView() { zoom = 1; offsetX = canvas.width / 2 - 400; offsetY = canvas.height / 2 - 300; drawMap(); }

// Canvas interactions
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left - offsetX) / zoom;
  const y = (e.clientY - rect.top - offsetY) / zoom;

  buses.forEach(bus => {
    if (currentRoute !== 'all' && currentRoute !== bus.route) return;
    const dx = x - bus.screenX;
    const dy = y - bus.screenY;
    if (Math.sqrt(dx*dx + dy*dy) < 20) {
      selectBus(bus);
    }
  });

  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
});

canvas.addEventListener('mousemove', (e) => {
  if (isDragging) {
    offsetX += e.clientX - lastMouseX;
    offsetY += e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    drawMap();
  }
});

canvas.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mouseleave', () => isDragging = false);

// ==================== SIMULATION ====================
function simulate() {
  buses.forEach(bus => {
    bus.progress += bus.speed;
    if (bus.progress >= 1) {
      bus.progress = 0;
      if (Math.random() > 0.7) {
        bus.status = 'delayed';
        bus.delay = Math.floor(Math.random() * 15) + 5;
        addNotification('Delay Alert', `${bus.name} on ${routes[bus.route].name.split(':')[0]} is delayed by ${bus.delay} minutes due to traffic.`, 'warning');
      } else {
        bus.status = 'on-time';
        bus.delay = 0;
      }
    }

    const route = routes[bus.route];
    const stopIndex = Math.floor(bus.progress * (route.stops.length - 1));
    bus.nextStop = route.stops[Math.min(stopIndex + 1, route.stops.length - 1)];
    bus.occupancy = Math.min(100, Math.max(10, bus.occupancy + (Math.random() - 0.5) * 5));
  });

  updateBusList();
  drawMap();

  if (selectedBus && !document.getElementById('eta-popup').classList.contains('hidden')) {
    selectBus(selectedBus);
  }
}

function randomEvents() {
  const events = [
    { title: 'Bus Departed', msg: 'Bus 101 has departed from Dorms North.', type: 'success' },
    { title: 'Traffic Update', msg: 'Heavy traffic reported near Engineering Hall.', type: 'warning' },
    { title: 'Arrival Alert', msg: 'Bus 201 arriving at Student Center in 2 minutes.', type: 'info' },
    { title: 'Route Change', msg: 'Route B is taking a detour due to roadwork.', type: 'warning' }
  ];

  if (Math.random() > 0.95 && notifEnabled) {
    const event = events[Math.floor(Math.random() * events.length)];
    addNotification(event.title, event.msg, event.type);
  }
}

// ==================== START ====================
updateBusList();
drawMap();
setInterval(simulate, 100);
setInterval(randomEvents, 5000);

setTimeout(() => addNotification('System Online', 'CampusBus AI tracking system is now active.', 'success'), 500);
